name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version tag at the selected commit (e.g., v5.7.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate exact release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Match existing tag, source commit and package version
        id: identity
        env:
          RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: python3 .github/workflows/release_contract.py identity
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Verify failing audit and incomplete release gates
        run: python3 .github/workflows/test_supply_chain.py
      - name: Run pinned security audit
        run: bash .github/workflows/audit.sh "$RUNNER_TEMP/audit.json"
      - name: Retain audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-audit
          path: ${{ runner.temp }}/audit.json
          if-no-files-found: error
      - name: Validate crates.io package without publication
        run: cargo publish --dry-run --locked

  build-release:
    needs: validate
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: unifictl-linux-x86_64
            asset_name: unifictl-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: unifictl-macos-x86_64
            asset_name: unifictl-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: unifictl-macos-aarch64
            asset_name: unifictl-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: unifictl-windows-x86_64
            asset_name: unifictl-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: |
          cargo build --locked --release --target ${{ matrix.target }}

      - name: Create release archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/unifictl release/
          cp README.md LICENSE release/
          tar czf ${{ matrix.asset_name }} -C release .
          rm -rf release

      - name: Create release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/unifictl.exe" "release/unifictl.exe"
          Copy-Item README.md "release/"
          Copy-Item LICENSE "release/"
          Compress-Archive -Path release/* -DestinationPath "${{ matrix.asset_name }}" -Force
          Remove-Item -Recurse -Force release

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}
          retention-days: 30
          if-no-files-found: error

  build-deb-packages:
    needs: validate
    name: Build DEB Packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.8.0 --locked

      - name: Install cross-compilation dependencies (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Build release binary (x86_64)
        if: matrix.arch == 'amd64'
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --verbose
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1

      - name: Build release binary (aarch64)
        if: matrix.arch == 'arm64'
        run: |
          CARGO_BUILD_JOBS=1 cargo build --locked --release --target ${{ matrix.target }} --verbose
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: 1
          OPENSSL_BUILD_JOBS: 1
          MAKEFLAGS: "-j1"

      - name: Build DEB package
        run: |
          cargo deb --locked --target ${{ matrix.target }} --no-build
          VERSION=${{ needs.validate.outputs.version }}
          mv target/${{ matrix.target }}/debian/unifictl_*.deb \
             unifictl_${VERSION}_${{ matrix.arch }}.deb

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unifictl-deb-${{ matrix.arch }}
          path: unifictl_*_${{ matrix.arch }}.deb
          retention-days: 30
          if-no-files-found: error

  build-arch-packages:
    needs: validate
    name: Build Arch Linux Packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
          - arch: aarch64
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install makepkg dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils zstd

      - name: Install cross-compilation dependencies
        if: matrix.arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Build release binary (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --verbose
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1

      - name: Build release binary (aarch64)
        if: matrix.arch == 'aarch64'
        run: |
          # Use single job to avoid OpenSSL make jobserver issues
          CARGO_BUILD_JOBS=1 cargo build --locked --release --target ${{ matrix.target }} --verbose
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          OPENSSL_STATIC: 1
          OPENSSL_VENDORED: 1
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: 1
          # Force single-threaded OpenSSL build
          OPENSSL_BUILD_JOBS: 1
          MAKEFLAGS: "-j1"

      - name: Update PKGBUILD
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ needs.validate.outputs.version }}/" packaging/arch/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/arch/PKGBUILD

      - name: Create package directory
        run: |
          mkdir -p pkg/usr/bin
          mkdir -p pkg/usr/share/doc/unifictl
          mkdir -p pkg/usr/share/licenses/unifictl

      - name: Install files
        run: |
          install -Dm755 target/${{ matrix.target }}/release/unifictl pkg/usr/bin/unifictl
          install -Dm644 README.md pkg/usr/share/doc/unifictl/README.md
          install -Dm644 LICENSE pkg/usr/share/licenses/unifictl/LICENSE

      - name: Create .PKGINFO
        run: |
          cat > pkg/.PKGINFO <<EOF
          pkgname = unifictl
          pkgver = ${{ needs.validate.outputs.version }}-1
          pkgdesc = CLI for UniFi Site Manager (API v1/EA)
          url = https://github.com/nachtschatt3n/unifictl
          builddate = $(date +%s)
          packager = GitHub Actions <actions@github.com>
          size = $(du -sb pkg | cut -f1)
          arch = ${{ matrix.arch }}
          license = GPL-3.0
          depend = openssl
          depend = glibc
          EOF

      - name: Create .MTREE
        run: |
          cd pkg
          find . -type f -o -type d | sort | sed 's|^\./||' | while read line; do
            if [ -d "$line" ]; then
              echo "/$line type=dir"
            else
              MODE=$(stat -c %a "$line" 2>/dev/null || echo 644)
              SIZE=$(stat -c %s "$line" 2>/dev/null || echo 0)
              echo "/$line type=file mode=$MODE size=$SIZE"
            fi
          done > .MTREE
          cd ..

      - name: Create package archive
        run: |
          cd pkg
          tar cf - .PKGINFO .MTREE usr/ | zstd -o ../unifictl-${{ needs.validate.outputs.version }}-1-${{ matrix.arch }}.pkg.tar.zst
          cd ..
          mv unifictl-${{ needs.validate.outputs.version }}-1-${{ matrix.arch }}.pkg.tar.zst unifictl-${{ matrix.arch }}.pkg.tar.zst

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unifictl-arch-${{ matrix.arch }}
          path: unifictl-${{ matrix.arch }}.pkg.tar.zst
          retention-days: 30
          if-no-files-found: error

  verify-artifacts:
    name: Verify complete release artifacts
    needs: [validate, build-release, build-arch-packages, build-deb-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: unifictl-*
          path: artifacts
      - name: Require every expected asset and generate checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
        run: python3 .github/workflows/release_contract.py assets
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-release
          path: dist/*
          if-no-files-found: error

  publish-crates-io:
    name: Publish to crates.io when configured
    needs: [validate, verify-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CRATES_IO_TOKEN is absent; crates.io publication is disabled."
            exit 0
          fi
          cargo publish --locked

  create-release:
    name: Create complete validated GitHub Release
    needs: [validate, verify-artifacts, publish-crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Refuse changes to an already-public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: python3 .github/workflows/release_contract.py preflight
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: dist
      - name: Verify downloaded assets before publication
        working-directory: dist
        run: sha256sum --check checksums.txt
      - name: Upload assets to a draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ needs.validate.outputs.sha }}
          name: Release ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Built and validated from commit `${{ needs.validate.outputs.sha }}`.
            Download the archive or package for your platform together with `checksums.txt`.
            Verify its SHA-256 checksum before installing. `release-source.json` records
            the source commit and lockfile digest. Checksums detect corruption; they are
            not independent signatures or a claim of reproducible builds.
            crates.io publication is optional and runs only when its token is configured.
          files: |
            dist/unifictl-*.tar.gz
            dist/unifictl-*.zip
            dist/unifictl_*.deb
            dist/unifictl-*.pkg.tar.zst
            dist/checksums.txt
            dist/release-source.json
          draft: true
          prerelease: false
      - name: Verify uploaded bytes before making the release public
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published
          python3 .github/workflows/release_contract.py uploaded
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
